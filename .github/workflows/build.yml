name: build
on:
  push:
    paths: ['all.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node build.js
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m 'Generate pages' || true
          git push
      - run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/${{ github.repository }}/pages -d '{"source":{"branch":"main","path":"/"}}' || true
